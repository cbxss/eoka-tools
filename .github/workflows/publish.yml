name: Publish

# Tag-triggered publish for any crate in the workspace.
# Push a tag like `eoka-cli-v0.1.1` to publish that crate at that version.
# Cargo.toml's version must match the tag's version, else the job fails fast.

on:
  push:
    tags:
      - "eoka-cli-v*"
      - "eoka-agent-v*"
      - "eoka-runner-v*"
      - "eoka-email-v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          # eoka-cli-v0.1.1 -> crate=eoka-cli, version=0.1.1
          CRATE="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $CRATE @ $VERSION"

      - name: Verify Cargo.toml version matches tag
        run: |
          MANIFEST="crates/${{ steps.parse.outputs.crate }}/Cargo.toml"
          ACTUAL=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$ACTUAL" != "${{ steps.parse.outputs.version }}" ]; then
            echo "Cargo.toml version '$ACTUAL' does not match tag '${{ steps.parse.outputs.version }}'" >&2
            exit 1
          fi

      - name: Publish
        run: |
          cargo publish \
            -p "${{ steps.parse.outputs.crate }}" \
            --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
