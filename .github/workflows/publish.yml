name: Publish

# Auto-publishes any workspace crate whose Cargo.toml version is ahead of
# crates.io. Runs on every push to main; safe to run repeatedly because
# already-published versions are skipped.

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish missing crate versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish each crate whose version is not on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          UA="eoka-tools-publish (${{ github.repository }})"

          # Stable publish order: leaf deps first so dependents resolve.
          for crate in eoka-runner eoka-email eoka-agent eoka-cli; do
            manifest="crates/${crate}/Cargo.toml"
            [ -f "$manifest" ] || continue

            version=$(grep '^version' "$manifest" | head -1 | sed 's/.*"\(.*\)"/\1/')
            tag="${crate}-v${version}"
            echo "::group::${crate} @ ${version}"

            api_url="https://crates.io/api/v1/crates/${crate}/${version}"
            http_status=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)
            if [ "$http_status" = "200" ]; then
              echo "${crate} ${version} already on crates.io — skip"
              echo "::endgroup::"
              continue
            fi

            echo "Publishing ${crate} ${version}"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — skip tag push"
            else
              git tag -a "$tag" -m "Release ${crate} v${version}"
              git push origin "$tag"
            fi
            echo "::endgroup::"
          done
