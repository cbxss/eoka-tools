[package]
name = "eoka-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP server and Rust session API for browser automation"
keywords = ["browser", "automation", "ai-agent", "mcp", "llm"]
categories = ["web-programming", "development-tools"]
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
documentation = "https://docs.rs/eoka-mcp"
readme = "README.md"
authors = ["cbxss"]

[[bin]]
name = "eoka-mcp"
path = "src/main.rs"

[dependencies]
eoka-server = { path = "../eoka-server", version = "0.1.8" }
eoka-proxy = { path = "../eoka-proxy", version = "0.1.0" }
captcha = { package = "eoka-captcha", version = "0.1.1", path = "../captcha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.0"
anyhow = "1"
base64 = "0.22"
dirs = "5"

[dev-dependencies]
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

[[example]]
name = "demo"
path = "examples/demo.rs"
