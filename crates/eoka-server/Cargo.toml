[package]
name = "eoka-server"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "Sidecar process exposing eoka browser automation over newline-delimited JSON-RPC (see PROTOCOL.md)"
keywords = ["browser", "automation", "sidecar", "json-rpc"]
categories = ["web-programming", "development-tools"]
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka-server"
path = "src/main.rs"

[dependencies]
eoka = "0.5.4"
eoka-proxy = { path = "../eoka-proxy", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
captcha = { package = "eoka-captcha", version = "0.1.1", path = "../captcha" }
