[package]
name = "eoka-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser automation CLI for AI agents and pentesting"
repository = "https://github.com/cbxss/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka"
path = "src/main.rs"

[dependencies]
eoka-agent = "0.1.4"
eoka = "0.3.14"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
anyhow = "1"
