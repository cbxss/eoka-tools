[package]
name = "eoka-cli"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "Browser automation CLI for AI agents and pentesting"
repository = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka"
path = "src/main.rs"

[dependencies]
eoka-agent = { version = "0.1.9", path = "../eoka-agent" }
eoka-proxy = { path = "../eoka-proxy", version = "0.1.0" }
captcha = { package = "eoka-captcha", version = "0.1.1", path = "../captcha" }
eoka = "0.5"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
anyhow = "1"
