[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/eoka-mcp", "crates/eoka-server"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

# Not adopted workspace-wide yet — individual crates tune feature sets
# independently (e.g. eoka-server's slimmer tokio features). These entries
# exist so eoka-cli's own dependency declarations have one source of truth
# instead of drifting; other crates are free to opt in the same way.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
